# The graphical interface of GetFEM, as a Python package (the getfem module
# itself comes from the build of GetFEM):
#
#     pip install -e gui            (from the sources of GetFEM; editable: the
#                                    examples and the library of materials are
#                                    read where they are)
#
# installs the command getfem_gui: "getfem_gui [model.json]" opens the window,
# "getfem_gui run model.json" and the other commands are those of
# "python -m getfem_gui".

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "getfem-gui"
dynamic = ["version"]
description = "A graphical user interface for GetFEM"
readme = "README.md"
license = {text = "LGPL-3.0-or-later WITH GCC-exception-3.1"}
dependencies = ["numpy"]

[project.optional-dependencies]
window = ["PySide6", "pyvista"]
meshers = ["gmsh"]

[project.scripts]
getfem_gui = "getfem_gui.cli:main"

[tool.setuptools]
packages = ["getfem_gui", "getfem_gui.app"]

[tool.setuptools.package-data]
getfem_gui = ["data/*.json"]
"getfem_gui.app" = ["resources/*"]

[tool.setuptools.dynamic]
version = {attr = "getfem_gui.__version__"}
